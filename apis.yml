name: Newleos Therapeutics
description: Newleos Therapeutics is a clinical-stage biotechnology company co-founded by Longwood Fund
  and seasoned CNS drug-development leaders, headquartered in Boston, Massachusetts. Its pipeline, licensed
  from Roche, develops oral small-molecule therapeutics targeting GABAA-gamma1, V1a, TAAR1 and GABAA-alpha5
  mechanisms, with first- or best-in-class potential for general anxiety, social anxiety, substance use
  disorders, and cognitive impairment. Newleos is a pharmaceutical R&D company with no public developer
  or API product surface; this profile captures its corporate web presence for the API Evangelist network.
